<!DOCTYPE html>
<html>
  <head>
    <title>Prime Lead Pulse</title>
    <style>
      body { width: 300px; padding: 15px; font-family: sans-serif; }
      input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
      button { width: 100%; padding: 10px; background: #4f46e5; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
      button:hover { background: #4338ca; }
      button.secondary { background: #e5e7eb; color: #374151; padding: 6px; font-size: 12px; margin-top: 10px;}
      button.secondary:hover { background: #d1d5db; }
      .hidden { display: none !important; }
      #errorMsg { color: red; font-size: 12px; margin-top: 5px; }
      #statusMsg { color: green; font-size: 12px; }
      .account-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; background: #f3f4f6; border-radius: 4px; margin-bottom: 8px; font-size: 13px;}
      .logout-btn { background: #ef4444; color: white; border: none; border-radius: 3px; padding: 4px 8px; cursor: pointer; font-size: 11px; width: auto;}
      .logout-btn:hover { background: #dc2626; }
      h4 { margin: 10px 0 5px 0; font-size: 14px;}
    </style>
  </head>
  <body>
    <h3>Prime Lead Pulse</h3>

    <div id="loggedInSection" class="hidden">
      <p id="statusMsg" style="margin-top:0;">Tracking is active for:</p>
      <div id="accountsList"></div>
      <button id="addAccountBtn" class="secondary">Add Another Account</button>
    </div>

    <div id="loginSection" style="margin-top: 15px;">
      <h4 id="loginTitle">Log in to link your Gmail tracker</h4>
      <input type="hidden" id="apiUrl" value="https://prime-lead-pulse-sigma.vercel.app" />
      <input type="email" id="email" placeholder="Email" />
      <input type="password" id="password" placeholder="Password" />
      <button id="loginBtn">Log In</button>
      <button id="cancelLoginBtn" class="secondary hidden">Cancel</button>
      <p id="errorMsg"></p>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
